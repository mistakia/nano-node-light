name: Test

on: push

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: yarn install
        run: |
          yarn install --frozen-lockfile

      # THE HERMETIC SET, and the ONE definition of it. `yarn verify` is
      # `yarn lint && yarn test` -- this whole job, since nothing here needs a
      # service. The pre-push gate
      # (user:cli/lib/pre-push-guard-local-verify.sh) runs THIS SAME script
      # against the outgoing SHA in a persistent worktree, so CI and the gate
      # cannot drift. Measured 2026-08-30: 3s.
      - name: Verify (lint + tests)
        run: yarn verify
