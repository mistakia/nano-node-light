compressionLevel: mixed

# Supply-chain hardening: refuse dependency install lifecycle scripts. The
# global ~/.yarnrc.yml enableScripts:false does not carry into CI, so it must
# be set per-project. The native build of @trashman/ed25519-blake2b is
# allowlisted via dependenciesMeta.built in package.json.
enableScripts: false

enableGlobalCache: false

nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.2.2.cjs
